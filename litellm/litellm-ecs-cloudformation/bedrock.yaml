AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Bedrock IAM Policy for LiteLLM ECS Task Role.
  Provides least-privilege permissions to invoke Bedrock models via IAM Role.

Parameters:
  EnvironmentName:
    Type: String
    Default: litellm
    Description: Environment name prefix

Resources:
  #============================================================
  # IAM Managed Policy for Bedrock Model Invocation
  #============================================================
  BedrockInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${EnvironmentName}-bedrock-invoke-policy
      Description: !Sub "Policy for ${EnvironmentName} ECS tasks to access Bedrock (full access)"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockFullAccess
            Effect: Allow
            Action:
              - bedrock:*
            Resource: '*'

#============================================================
# Outputs
#============================================================
Outputs:
  BedrockInvokePolicyArn:
    Description: IAM Managed Policy ARN for Bedrock model invocation (attached to ECS Task Role)
    Value: !Ref BedrockInvokePolicy
    Export:
      Name: !Sub ${EnvironmentName}-BedrockInvokePolicyArn

  BedrockInvokePolicyName:
    Description: IAM Managed Policy name
    Value: !Sub ${EnvironmentName}-bedrock-invoke-policy

  AuthMethod:
    Description: Authentication method used for Bedrock access
    Value: "IAM Role (attached to ECS Task Role via ManagedPolicyArns)"

  SupportedModels:
    Description: Bedrock models allowed by this policy
    Value: "All Bedrock models (full access)"

  HowItWorks:
    Description: How Bedrock auth works with ECS
    Value: "ECS Task Role has this policy attached. LiteLLM auto-detects IAM credentials from the task metadata endpoint. No API keys needed."
