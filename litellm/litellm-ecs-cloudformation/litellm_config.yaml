model_list:
  # NOTE on timeouts (extended thinking): botocore's default read_timeout is
  # 60s. With large thinking budgets a single invocation can run many minutes,
  # so without an explicit timeout LiteLLM/Bedrock aborts the upstream call and
  # NO amount of SSE heartbeat can save it (heartbeat only feeds idle timers,
  # not this hard abort). `timeout: 900` below is the botocore read_timeout.
  - model_name: bedrock-claude-opus-4-6-v1
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-4-6-v1
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  - model_name: bedrock-claude-opus-4-7
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-4-7
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  # GPT-5.5 / GPT-5.4 — bedrock-runtime (Converse) with the ECS Task Role.
  # No API key: auth is the task role's SigV4 credentials, same as Claude, and
  # traffic uses the bedrock-runtime PrivateLink endpoint in vpc.yaml.
  # Must use the `us.` inference profile; the bare `openai.gpt-5.5` id is
  # INFERENCE_PROFILE-only and is not callable on demand.
  # Verified on LiteLLM v1.89.0: /v1/chat/completions (incl. stream + tools)
  # and /v1/responses both work. Don't use `bedrock/chat_completions/` for
  # these ids on v1.89.0 (fails with "Checksum mismatch").
  - model_name: gpt-5.5
    litellm_params:
      model: bedrock/us.openai.gpt-5.5
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  - model_name: gpt-5.4
    litellm_params:
      model: bedrock/us.openai.gpt-5.4
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  # ── Optional: bedrock-mantle endpoint (Bedrock API key) ──────────────────
  # Only for a model/feature that bedrock-runtime doesn't offer. Requires
  # ENABLE_MANTLE=true and a LONG-TERM Bedrock API key (starts with "ABSK"):
  #   ENABLE_MANTLE=true BEDROCK_MANTLE_API_KEY=ABSK... ./deploy.sh deploy-ecs
  #   ENABLE_MANTLE=true BEDROCK_MANTLE_API_KEY=ABSK... ./deploy.sh upload-mantle-key
  # Short-term keys (bedrock-api-key-..., max 12h) expire and return 401
  # "Signature expired".
  #
  # - model_name: gpt-5.5-mantle
  #   litellm_params:
  #     model: openai/openai.gpt-5.5
  #     api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
  #     api_key: os.environ/BEDROCK_MANTLE_API_KEY
  #     timeout: 900
  #     drop_params: true
  #     additional_drop_params: ["client_metadata", "metadata"]

general_settings:
  database_url: os.environ/DATABASE_URL
  user_api_key_cache_ttl: 300
  store_model_in_db: true
  # Global ceiling for a request. Keep >= per-model timeout so long extended
  # thinking isn't aborted by the proxy itself before the model responds.
  request_timeout: 900

litellm_settings:
  drop_params: true
  cache: true
  enable_redis_auth_cache: true
  store_audit_logs: true
  additional_drop_params: ["client_metadata", "metadata"]
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ssl: true
  success_callback: ["s3_v2"]
  s3_callback_params:
    s3_bucket_name: os.environ/S3_BUCKET_NAME
    s3_region_name: os.environ/AWS_DEFAULT_REGION
    s3_path: litellm-logs
    s3_endpoint_url: https://s3.amazonaws.com
