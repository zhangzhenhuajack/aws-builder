model_list:
  # NOTE on timeouts (extended thinking): botocore's default read_timeout is
  # 60s. With large thinking budgets a single invocation can run many minutes,
  # so without an explicit timeout LiteLLM/Bedrock aborts the upstream call and
  # NO amount of SSE heartbeat can save it (heartbeat only feeds idle timers,
  # not this hard abort). `timeout: 900` below is the botocore read_timeout.
  - model_name: bedrock-claude-opus-4-6-v1
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-4-6-v1
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  - model_name: bedrock-claude-opus-4-7
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-4-7
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  # GPT-5.5 — 最强推理/编码能力
  - model_name: gpt-5.5
    litellm_params:
      model: openai/openai.gpt-5.5
      api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  # GPT-5.4 — 最佳性价比（us-east-2 主 + us-west-2 fallback）
  - model_name: gpt-5.4
    litellm_params:
      model: openai/openai.gpt-5.4
      api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  # ── Codex 内部任务模型别名 ──
  # Codex（含 guardian_approval 执行前自动审批、自动 review 等）会在后台硬编码
  # 调用一批 OpenAI 原生 slug（codex-auto-review / gpt-5.4-mini / gpt-5 /
  # gpt-5-codex）来跑内部任务。网关缺少这些 model_name 会返回 400，进而阻断
  # Codex 的工具调用链（含 web search）。这里把它们别名映射到真实的 Mantle
  # 模型上；不关闭 guardian，保留审批能力。
  - model_name: codex-auto-review
    litellm_params:
      model: openai/openai.gpt-5.5
      api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/openai.gpt-5.4
      api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  - model_name: gpt-5
    litellm_params:
      model: openai/openai.gpt-5.5
      api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

  - model_name: gpt-5-codex
    litellm_params:
      model: openai/openai.gpt-5.5
      api_base: https://bedrock-mantle.us-east-2.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY
      timeout: 900
      drop_params: true
      additional_drop_params: ["client_metadata", "metadata"]

general_settings:
  database_url: os.environ/DATABASE_URL
  user_api_key_cache_ttl: 300
  store_model_in_db: true
  # Global ceiling for a request. Keep >= per-model timeout so long extended
  # thinking isn't aborted by the proxy itself before the model responds.
  request_timeout: 900

litellm_settings:
  drop_params: true
  cache: true
  enable_redis_auth_cache: true
  store_audit_logs: true
  additional_drop_params: ["client_metadata", "metadata"]
  # Custom pre-call hook: flattens Codex's non-standard `additional_tools` input
  # item into the standard top-level `tools` field so Bedrock Mantle's Responses
  # API accepts the request (see codex_additional_tools_flatten.py). Registered
  # under `callbacks` (not success_callback) so its async_pre_call_hook fires.
  callbacks: ["codex_additional_tools_flatten.codex_additional_tools_flatten_instance"]
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ssl: true
  success_callback: ["s3_v2"]
  s3_callback_params:
    s3_bucket_name: os.environ/S3_BUCKET_NAME
    s3_region_name: os.environ/AWS_DEFAULT_REGION
    s3_path: litellm-logs
    s3_endpoint_url: https://s3.amazonaws.com
