AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LiteLLM ECS Fargate Service with Internal ALB, Secrets Manager,
  IAM Role-based Bedrock access, config on S3, security best practices.

Parameters:
  EnvironmentName:
    Type: String
    Default: litellm
    Description: Environment name (must match other stacks)

  LiteLLMImage:
    Type: String
    Default: docker.litellm.ai/berriai/litellm:v1.89.0
    Description: >
      LiteLLM Docker image. Default tag publishes both linux/amd64 and
      linux/arm64 manifests, so it works with the CpuArchitecture parameter
      below. If you switch to a custom image, make sure it provides the
      architecture you select.

  TaskCpu:
    Type: Number
    Default: 2048
    Description: Task CPU units (1024 = 1 vCPU)

  TaskMemory:
    Type: Number
    Default: 4096
    Description: Task memory in MB

  DesiredCount:
    Type: Number
    Default: 1
    Description: Desired number of ECS tasks

  SearxngApiBase:
    Type: String
    Default: ''
    Description: SearXNG API base URL (optional, leave empty to disable)

  ContainerPort:
    Type: Number
    Default: 4000
    Description: Container port for LiteLLM

  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
      - ARM64
      - X86_64
    Description: >
      Fargate task CPU architecture. Default ARM64 runs on AWS Graviton for
      better price/performance. Switch to X86_64 if you must use an image
      that does not publish an arm64 manifest, or if a third-party
      dependency in the task is x86-only.

  SidecarImage:
    Type: String
    Default: ''
    Description: >
      SSE heartbeat proxy sidecar image URI (ECR). Leave empty to disable the
      sidecar — the ALB then targets LiteLLM directly (original behavior).
      When set, ALB targets the sidecar on 8080, which proxies to LiteLLM on
      127.0.0.1:4000 and injects SSE keepalive bytes during long-thinking
      silences so CloudFront's origin Response timeout doesn't cut the stream.

  HeartbeatInterval:
    Type: Number
    Default: 15
    Description: Seconds between SSE keepalive injections (must be < CloudFront OriginReadTimeout)

  SidecarPort:
    Type: Number
    Default: 8080
    Description: Port the heartbeat sidecar listens on (ALB target when sidecar is enabled)

Conditions:
  HasSidecar: !Not [!Equals [!Ref SidecarImage, '']]

Resources:
  #============================================================
  # Secrets Manager - LiteLLM Master Key
  #============================================================
  MasterKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/litellm/master-key
      Description: LiteLLM Master Key for admin access
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: LITELLM_MASTER_KEY
        PasswordLength: 40
        ExcludeCharacters: '"@/\'''
        IncludeSpace: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-master-key
        - Key: Environment
          Value: !Ref EnvironmentName

  #============================================================
  # Secrets Manager - Bedrock Mantle API Key
  #============================================================
  BedrockMantleApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/litellm/bedrock-mantle-api-key
      Description: Bedrock Mantle API Key for OpenAI-compatible GPT models
      SecretString: '{"BEDROCK_MANTLE_API_KEY":"PLACEHOLDER"}'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-bedrock-mantle-api-key
        - Key: Environment
          Value: !Ref EnvironmentName

  #============================================================
  # ECS Cluster
  #============================================================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-ecs-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-cluster
        - Key: Environment
          Value: !Ref EnvironmentName

  #============================================================
  # IAM Roles
  #============================================================
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref MasterKeySecret
                  - !Ref BedrockMantleApiKeySecret
                  - Fn::ImportValue: !Sub ${EnvironmentName}-AuroraSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Bedrock access via IAM Role (from bedrock.yaml stack)
        - Fn::ImportValue: !Sub ${EnvironmentName}-BedrockInvokePolicyArn
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub
                    - "arn:aws:s3:::${BucketName}/config/*"
                    - BucketName:
                        Fn::ImportValue: !Sub ${EnvironmentName}-S3BucketName
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub
                    - "arn:aws:s3:::${BucketName}/litellm-logs/*"
                    - BucketName:
                        Fn::ImportValue: !Sub ${EnvironmentName}-S3BucketName
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub
                    - "arn:aws:s3:::${BucketName}"
                    - BucketName:
                        Fn::ImportValue: !Sub ${EnvironmentName}-S3BucketName
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - Fn::ImportValue: !Sub ${EnvironmentName}-DynamoDBTableArn
                  - !Sub
                    - "${TableArn}/index/*"
                    - TableArn:
                        Fn::ImportValue: !Sub ${EnvironmentName}-DynamoDBTableArn
        - PolicyName: ElastiCacheAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticache:Connect
                  - elasticache:DescribeServerlessCaches
                Resource: '*'

  #============================================================
  # Security Groups
  #============================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for internal ALB (CloudFront VPC origin)
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp:
            Fn::ImportValue: !Sub ${EnvironmentName}-VpcCIDR
          Description: Allow HTTP from within VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-alb-sg

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      SecurityGroupIngress:
        # ALB → sidecar port (8080) when the heartbeat sidecar is enabled,
        # otherwise ALB → LiteLLM port (4000) directly.
        - IpProtocol: tcp
          FromPort: !If [HasSidecar, !Ref SidecarPort, !Ref ContainerPort]
          ToPort: !If [HasSidecar, !Ref SidecarPort, !Ref ContainerPort]
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow traffic from ALB only
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-sg

  #============================================================
  # Application Load Balancer (Internal)
  #============================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-int-alb
      Type: application
      Scheme: internal
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet1Id
        - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet2Id
      LoadBalancerAttributes:
        # Idle timeout: reset by data bytes, so the ~15s SSE heartbeat keeps it
        # alive. 300 is well above the heartbeat interval (must not drop near it).
        - Key: idle_timeout.timeout_seconds
          Value: '300'
        # Max lifetime of a single client<->ALB connection regardless of
        # activity. Default 3600s would gracefully close a stream running past
        # 1h. Our streams cap at request_timeout=900s, so 3600 is safe — set
        # explicitly to document the ceiling and avoid surprise if raised later.
        - Key: client_keep_alive.seconds
          Value: '3600'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-int-alb

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-ecs-tg
      # Target the sidecar (8080) when enabled, else LiteLLM (4000) directly.
      # The sidecar passes /health/liveliness straight through to LiteLLM.
      Port: !If [HasSidecar, !Ref SidecarPort, !Ref ContainerPort]
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      TargetType: ip
      HealthCheckPath: /health/liveliness
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      TargetGroupAttributes:
        # During a deploy/scale-in the task enters DEACTIVATING and keeps
        # serving in-flight requests for up to this long (ALB draining) BEFORE
        # ECS sends SIGTERM — so an in-flight extended-thinking stream finishes
        # cleanly. 3600 is the ALB hard max (range 0-3600; 3900 would be
        # REJECTED at deploy time). Our streams cap at request_timeout=900s, so
        # 3600 leaves ample headroom; after draining the 120s stopTimeout
        # (Fargate hard max) is plenty since the container is then idle.
        - Key: deregistration_delay.timeout_seconds
          Value: '3600'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  #============================================================
  # CloudWatch Log Group
  #============================================================
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}/litellm
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-litellm-logs

  #============================================================
  # ECS Task Definition
  #============================================================
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-litellm
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        # Init container: download config from S3
        - Name: config-init
          Image: amazon/aws-cli:latest
          Essential: false
          Command:
            - "s3"
            - "cp"
            - !Sub
              - "s3://${BucketName}/config/litellm_config.yaml"
              - BucketName:
                  Fn::ImportValue: !Sub ${EnvironmentName}-S3BucketName
            - "/config/litellm_config.yaml"
          MountPoints:
            - SourceVolume: config-volume
              ContainerPath: /config
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: config-init

        # Main container: LiteLLM (IAM Role auth for Bedrock)
        - Name: litellm
          Image: !Ref LiteLLMImage
          Essential: true
          DependsOn:
            - ContainerName: config-init
              Condition: SUCCESS
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          EntryPoint:
            - "/bin/sh"
            - "-c"
          Command:
            - !Join
              - ""
              - - "export DATABASE_URL=$(python3 -c 'import urllib.parse,os;u=urllib.parse.quote(os.environ[\"DB_USERNAME\"],safe=\"\");p=urllib.parse.quote(os.environ[\"DB_PASSWORD\"],safe=\"\");print(f\"postgresql://{u}:{p}@"
                - Fn::ImportValue: !Sub ${EnvironmentName}-AuroraEndpoint
                - ":5432/litellm\")') && exec litellm --config /config/litellm_config.yaml"
          MountPoints:
            - SourceVolume: config-volume
              ContainerPath: /config
          Environment:
            - Name: SEARXNG_API_BASE
              Value: !Ref SearxngApiBase
            - Name: REDIS_HOST
              Value:
                Fn::ImportValue: !Sub ${EnvironmentName}-RedisEndpoint
            - Name: REDIS_PORT
              Value:
                Fn::ImportValue: !Sub ${EnvironmentName}-RedisPort
            - Name: S3_BUCKET_NAME
              Value:
                Fn::ImportValue: !Sub ${EnvironmentName}-S3BucketName
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: NO_DOCS
              Value: "True"
            - Name: NO_REDOC
              Value: "True"
          Secrets:
            - Name: LITELLM_MASTER_KEY
              ValueFrom: !Sub "${MasterKeySecret}:LITELLM_MASTER_KEY::"
            - Name: BEDROCK_MANTLE_API_KEY
              ValueFrom: !Sub "${BedrockMantleApiKeySecret}:BEDROCK_MANTLE_API_KEY::"
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - "${SecretArn}:username::"
                - SecretArn:
                    Fn::ImportValue: !Sub ${EnvironmentName}-AuroraSecretArn
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${SecretArn}:password::"
                - SecretArn:
                    Fn::ImportValue: !Sub ${EnvironmentName}-AuroraSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: litellm
          HealthCheck:
            Command:
              - CMD-SHELL
              - "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")' || exit 1"
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 120
          # Grace period after SIGTERM before SIGKILL. 120 is the Fargate hard
          # max. By the time SIGTERM is sent the ALB has already drained
          # (deregistration_delay), so in-flight streams are done and the
          # container just needs a clean exit.
          StopTimeout: 120

        # SSE heartbeat proxy sidecar (only injected when SidecarImage is set).
        # ALB → :8080 (this) → LiteLLM 127.0.0.1:4000. Injects ": keepalive"
        # during long-thinking silences so CloudFront's idle timeout doesn't cut
        # the stream. Zero changes to LiteLLM itself.
        - !If
          - HasSidecar
          - Name: sse-heartbeat
            Image: !Ref SidecarImage
            Essential: true
            DependsOn:
              - ContainerName: litellm
                Condition: HEALTHY
            PortMappings:
              - ContainerPort: !Ref SidecarPort
                Protocol: tcp
            Environment:
              - Name: UPSTREAM_BASE
                Value: !Sub "http://127.0.0.1:${ContainerPort}"
              - Name: LISTEN_PORT
                Value: !Ref SidecarPort
              - Name: HEARTBEAT_INTERVAL
                Value: !Ref HeartbeatInterval
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !Ref LogGroup
                awslogs-region: !Ref AWS::Region
                awslogs-stream-prefix: sse-heartbeat
            HealthCheck:
              Command:
                - CMD-SHELL
                - !Sub "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:${SidecarPort}/health/liveliness\")' || exit 1"
              Interval: 30
              Timeout: 10
              Retries: 5
              StartPeriod: 120
            StopTimeout: 120  # Fargate hard max; ALB has drained before SIGTERM
          - !Ref AWS::NoValue
      Volumes:
        - Name: config-volume
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-litellm-task

  #============================================================
  # ECS Service
  #============================================================
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub ${EnvironmentName}-litellm-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 300
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet1Id
            - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet2Id
      LoadBalancers:
        # Point the ALB at the sidecar container when enabled, else LiteLLM.
        - ContainerName: !If [HasSidecar, sse-heartbeat, litellm]
          ContainerPort: !If [HasSidecar, !Ref SidecarPort, !Ref ContainerPort]
          TargetGroupArn: !Ref ALBTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableExecuteCommand: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-litellm-service

  #============================================================
  # Auto Scaling
  #============================================================
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: !Ref DesiredCount
      ResourceId: !Sub service/${ECSCluster}/${ECSService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${EnvironmentName}-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  ScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${EnvironmentName}-memory-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: 80
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

#============================================================
# Outputs
#============================================================
Outputs:
  ClusterName:
    Description: ECS Cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${EnvironmentName}-ECSClusterName

  ServiceName:
    Description: ECS Service name
    Value: !GetAtt ECSService.Name

  ALBDnsName:
    Description: Internal ALB DNS name
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub ${EnvironmentName}-ALBDnsName

  ALBArn:
    Description: Internal ALB ARN (for CloudFront VPC origin)
    Value: !Ref ALB
    Export:
      Name: !Sub ${EnvironmentName}-ALBArn

  ALBSecurityGroupId:
    Description: ALB Security Group ID (add CloudFront VPC Origin SG after deploying cloudfront-waf.yaml)
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-ALBSecurityGroupId

  ALBUrl:
    Description: LiteLLM internal URL
    Value: !Sub "http://${ALB.DNSName}"

  MasterKeySecretArn:
    Description: Secrets Manager ARN for LiteLLM Master Key (auto-generated)
    Value: !Ref MasterKeySecret

  HowToGetMasterKey:
    Description: Command to retrieve the auto-generated LiteLLM Master Key
    Value: !Sub
      - "aws secretsmanager get-secret-value --secret-id ${SecretId} --query SecretString --output text | jq -r .LITELLM_MASTER_KEY"
      - SecretId: !Ref MasterKeySecret

  ConfigUploadCommand:
    Description: Command to upload litellm config to S3
    Value: !Sub
      - "aws s3 cp litellm_config.yaml s3://${BucketName}/config/litellm_config.yaml"
      - BucketName:
          Fn::ImportValue: !Sub ${EnvironmentName}-S3BucketName

  PostDeployCloudFrontSG:
    Description: >
      After deploying cloudfront-waf.yaml, run this to allow CloudFront VPC Origin access to ALB
    Value: !Sub
      - "aws ec2 authorize-security-group-ingress --group-id ${ALBSg} --protocol tcp --port 80 --source-group $(aws ec2 describe-security-groups --filters Name=group-name,Values=CloudFront-VPCOrigins-Service-SG --query SecurityGroups[0].GroupId --output text --region ${AWS::Region}) --region ${AWS::Region}"
      - ALBSg: !Ref ALBSecurityGroup
